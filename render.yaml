services:
  - type: web
    name: crm-lead-management
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-lead-management-db
          property: connectionString

databases:
  - name: crm-lead-management-db
    databaseName: crmleaddb
    user: crmuser
    plan: free
